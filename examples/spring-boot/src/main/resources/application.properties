server.port=8080

ageris.application=myapp
# The folder that holds myapp/featureflags.json and myapp/configs.json, seen from where the example is started.
ageris.path=../config
# Short, so that a change in a file shows within seconds. The default is ten seconds.
ageris.refresh-interval=2s
ageris.feature-flags.files=/featureflags.json
ageris.configs.files=/configs.json

# Show each part of the health with its details, so that it shows what Ageris has loaded.
management.endpoint.health.show-details=always
