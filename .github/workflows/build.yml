name: build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 17 is the oldest Java the artifacts run on; 25 is the current LTS; 27 is what the Helidon module needs.
        java: [ '17', '25', '27' ]
    name: build (Java ${{ matrix.java }})
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: maven

      - name: Build and verify
        run: ./mvnw -B verify

      # The examples are projects of their own that use the released Ageris from Maven Central, so they are built apart.
      - name: Build and test the Spring Boot example
        run: ./mvnw -B -f examples/spring-boot/pom.xml verify

      - name: Build and test the Helidon example
        # Helidon 27 needs Java 27.
        if: matrix.java == '27'
        run: ./mvnw -B -f examples/helidon/pom.xml verify

      - name: Upload analysis reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: analysis-reports-java-${{ matrix.java }}
          path: |
            **/target/site/
            **/target/surefire-reports/
            **/target/spotbugs*.xml
          if-no-files-found: ignore
