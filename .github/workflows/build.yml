name: build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          # Artifacts target release 17; the build itself runs on the current LTS.
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build and verify
        run: ./mvnw -B verify

      - name: Upload analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-reports
          path: |
            **/target/site/
            **/target/surefire-reports/
            **/target/spotbugs*.xml
          if-no-files-found: ignore
